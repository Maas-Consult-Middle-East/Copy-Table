rules:
  - id: relaxed-permissions
    languages: [json]
    severity: WARNING
    message: Avoid using "All" role in DocType permissions — it grants access to every user, including Website Users.
    paths:
      include:
        - "*/doctype/*/*.json"
    pattern: |
      "role": "All"

  - id: frappe-cur-frm-usage
    languages: [javascript]
    severity: WARNING
    message: "cur_frm is deprecated and can introduce buggy behaviour — use the frm parameter passed to the event handler instead."
    fix: frm
    pattern: cur_frm
